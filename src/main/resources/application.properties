spring.application.name=foodordering
server.port=${PORT:8080}

# Database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodordering}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://foodie-food-ordering-system.vercel.app}